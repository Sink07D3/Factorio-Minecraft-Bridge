[entity-description]
send-chest=Exports one stack to the bridge (see mod README). Blue tint.
receive-chest=Accepts items from the bridge via RCON into inventory. Red tint.
send-tank=Exports fluid from this tank to the bridge (fluid name and amount). Connect pipes like a storage tank.
receive-tank=Accepts fluid from the bridge into this tank. Connect pipes like a storage tank.
send-accumulator=Stores power like a normal accumulator (5 MJ, 300 kW). The bridge reads stored energy (as electric-energy:joules in toMC.dat) and drains the buffer each export tick.
receive-accumulator=Stores power like a normal accumulator. The bridge can inject energy via the receiveAccumulators remote (joules).